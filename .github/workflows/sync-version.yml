# Keeps the version shown as plain text in sync with app/version.js (the ONE place to edit at a release).
# Edit app/version.js and push to main: this workflow updates CITATION.cff, README.md, me_canvas.html and the site pages,
# commits the result, and re-runs the Website workflow (a push made with GITHUB_TOKEN does not start other workflows).
# It then publishes the GitHub release itself, after the sync, so the release contains the synced files:
# tag = "v" + version (a version with a hyphen such as 1.4.0-beta.1 becomes a pre-release), notes generated from the merged pull requests,
# and the offline ZIP attached. If that release already exists nothing happens, so only bump the version when you really want a release.
name: Sync version and publish release

on:
  push:
    branches: [main]
    paths: ['app/version.js']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update the files
        run: node tools/sync-version.mjs
      - name: Commit and redeploy the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Already in sync."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync version text with app/version.js"
          git push
          gh workflow run pages.yml

      - name: Publish the release and attach the offline ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" app/version.js | head -1)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Unexpected version '$VERSION' in app/version.js"; exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists: nothing to do."; exit 0; fi
          FLAGS=""
          if [[ "$VERSION" == *-* ]]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes $FLAGS
          # A release created with GITHUB_TOKEN does not start other workflows, so run the ZIP workflow explicitly
          gh workflow run offline-zip.yml -f tag="$TAG"
