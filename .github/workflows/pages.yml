# Website on GitHub Pages: the documentation pages in site/ and the app itself (me_canvas.html + app/),
# so the pages can link to me_canvas.html and read app/version.js. No build step: files are copied as they are.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'me_canvas.html', 'demo.html', 'app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp me_canvas.html demo.html _site/
          cp -r app _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
